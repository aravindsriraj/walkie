[project]
name = "walkie-server"
version = "0.1.0"
description = "Walkie API: recordings in, help articles out."
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-genai>=2.33.0,<3",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "ruff>=0.4.6,<1.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = "."

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
