<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme Projects</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #111827; }
  header { background: #0f172a; color: #fff; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; }
  .card { background: #fff; max-width: 380px; margin: 80px auto; padding: 28px; border-radius: 12px; box-shadow: 0 1px 3px #0002; }
  label { display: block; font-size: 13px; margin: 14px 0 4px; color: #374151; }
  input, select { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; }
  button { margin-top: 18px; padding: 10px 16px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  .dash { max-width: 900px; margin: 32px auto; padding: 0 24px; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  table { width: 100%; background: #fff; border-radius: 10px; border-collapse: collapse; margin-top: 16px; }
  td, th { text-align: left; padding: 12px 16px; border-bottom: 1px solid #eee; }
  .modal { position: fixed; inset: 0; background: #0006; display: none; }
  .modal .card { margin-top: 120px; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #16a34a; color: #fff; padding: 12px 18px; border-radius: 8px; display: none; }
</style>
</head>
<body>
<header><b>Acme Projects</b><span id="who"></span></header>

<section id="login" class="card">
  <h2 style="margin-top:0">Sign in</h2>
  <label for="email">Work email</label><input id="email" type="email" autocomplete="email">
  <label for="password">Password</label><input id="password" type="password">
  <button id="signin">Sign in</button>
</section>

<section id="dash" class="dash" style="display:none">
  <div class="row"><h2>Projects</h2><button id="new">+ New project</button></div>
  <table><thead><tr><th>Name</th><th>Visibility</th></tr></thead><tbody id="rows"><tr><td>Website redesign</td><td>Team</td></tr></tbody></table>
</section>

<div id="modal" class="modal"><div class="card">
  <h2 style="margin-top:0">New project</h2>
  <label for="pname">Project name</label><input id="pname" placeholder="e.g. Q4 launch">
  <label for="vis">Visibility</label>
  <select id="vis"><option>Private</option><option>Team</option><option>Public</option></select>
  <button id="create">Create project</button>
</div></div>
<div id="toast" class="toast">Project created</div>

<script>
  const $ = (id) => document.getElementById(id);
  $("signin").onclick = () => { $("login").style.display = "none"; $("dash").style.display = "block"; $("who").textContent = $("email").value; };
  $("new").onclick = () => { $("modal").style.display = "block"; };
  $("create").onclick = () => {
    $("rows").insertAdjacentHTML("afterbegin", `<tr><td>${$("pname").value}</td><td>${$("vis").value}</td></tr>`);
    $("modal").style.display = "none"; $("toast").style.display = "block";
  };
</script>
</body>
</html>
